<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>TRACK_X SECURE — Géolocalisation IP Professionnelle</title>
    <meta name="description" content="Localisez n'importe quelle adresse IP avec précision. Ville, pays, ISP, ASN, carte interactive. Développé par VARNOX PRIME OFFICIAL." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%2300e5ff' stroke-width='6'/><circle cx='50' cy='50' r='5' fill='%23ff2323'/><line x1='50' y1='10' x2='50' y2='90' stroke='%2300e5ff' stroke-width='3'/><line x1='10' y1='50' x2='90' y2='50' stroke='%2300e5ff' stroke-width='3'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Suppress Replit badge before page renders
      (function() {
        function killBadge() {
          var selectors = [
            '[data-replit-badge]', '.replit-badge', '#replit-badge',
            '[class*="replit-ui-theme"]', '[id*="replit-badge"]',
            'script[src*="replit-pill"]', 'script[src*="replit-cdn"]'
          ];
          selectors.forEach(function(s) {
            try { document.querySelectorAll(s).forEach(function(el) { el.remove(); }); } catch(e) {}
          });
          // Also nuke iframes from replit
          document.querySelectorAll('iframe').forEach(function(f) {
            if (f.src && f.src.includes('replit')) f.remove();
          });
        }
        // Run immediately and on DOM mutations
        var observer = new MutationObserver(killBadge);
        document.addEventListener('DOMContentLoaded', function() {
          killBadge();
          observer.observe(document.body, { childList: true, subtree: true });
        });
        killBadge();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
