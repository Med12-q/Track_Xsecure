    <script>
      (function() {
        var kill = function() {
          ['[data-replit-badge]','.replit-badge','#replit-badge','[class*="replit-ui-theme"]','[id*="replit-badge"]'].forEach(function(s){
            try { document.querySelectorAll(s).forEach(function(el){ el.remove(); }); } catch(e){}
          });
          document.querySelectorAll('iframe,script').forEach(function(el){
            if ((el.src||'').includes('replit')) el.remove();
          });
        };
        document.addEventListener('DOMContentLoaded', function(){
          kill();
          new MutationObserver(kill).observe(document.body, {childList:true, subtree:true});
        });
        kill();
      })();
    </script>
